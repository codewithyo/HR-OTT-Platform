<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARQUEE Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#0b0b0d;
    --text:#f5f5f1;
    --text-dim:#9a9aa0;
    --red:#e50914;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Space Mono', monospace;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- HEADER ---------- */
  .player-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 30px;
    background:rgba(11,11,13,.95);
    border-bottom:1px solid rgba(255,255,255,.1);
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .back-btn{
    background:none;
    border:1px solid rgba(255,255,255,.25);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    transition:background .2s ease, border-color .2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .back-btn:hover{
    background:rgba(255,255,255,.1);
    border-color:var(--red);
  }

  .header-title{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .header-logo{
    font-family:var(--font-display);
    font-size:18px;
    letter-spacing:2px;
    color:var(--red);
    text-transform:uppercase;
  }

  .header-movie-title{
    font-size:14px;
    color:var(--text-dim);
    max-width:300px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .player-mode-badge{
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 8px;
    background:var(--red);
    color:white;
    border-radius:3px;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  /* ---------- MAIN PLAYER AREA ---------- */
  .player-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    position:relative;
    overflow:hidden;
  }

  .iframe-wrapper{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }

  /* ---------- LOADING STATE ---------- */
  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    color:var(--text-dim);
  }

  .spinner{
    width:50px;
    height:50px;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .loading-text{
    font-family:var(--font-mono);
    font-size:13px;
  }

  /* ---------- ERROR STATE ---------- */
  .error-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    color:var(--text-dim);
    padding:40px;
    text-align:center;
  }

  .error-icon{
    font-size:48px;
  }

  .error-title{
    font-family:var(--font-display);
    font-size:22px;
    color:var(--red);
    text-transform:uppercase;
  }

  .error-message{
    font-size:14px;
    max-width:500px;
    line-height:1.6;
  }

  .retry-btn{
    background:var(--red);
    color:white;
    border:none;
    padding:10px 24px;
    border-radius:4px;
    cursor:pointer;
    font-weight:700;
    margin-top:16px;
    transition:background .2s ease;
  }

  .retry-btn:hover{
    background:#c40812;
  }

  /* ---------- FOOTER ---------- */
  .player-footer{
    padding:20px 30px;
    background:rgba(11,11,13,.95);
    border-top:1px solid rgba(255,255,255,.1);
    font-size:12px;
    color:var(--text-dim);
    font-family:var(--font-mono);
    text-align:center;
  }

  @media (max-width: 720px){
    .player-header, .player-footer{
      padding:15px 20px;
    }

    .header-movie-title{
      max-width:200px;
    }

    .header-logo{
      font-size:14px;
      letter-spacing:1px;
    }
  }
</style>
</head>
<body>

  <div class="player-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn">←</button>
      <div class="header-title">
        <div class="header-logo">MARQUEE</div>
        <div class="header-movie-title" id="movieTitle">Loading...</div>
      </div>
    </div>
    <div class="player-mode-badge" id="modeBadge">Movie</div>
  </div>

  <div class="player-container">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Preparing player...</div>
    </div>
  </div>

  <div class="player-footer">
    Streaming powered by VidSrc • MARQUEE is a personal project using TMDB API
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');
  const id = params.get('id');
  const title = params.get('title');

  const headerTitle = document.getElementById('movieTitle');
  const modeBadge = document.getElementById('modeBadge');
  const playerContainer = document.querySelector('.player-container');

  if(title){
    headerTitle.textContent = decodeURIComponent(title);
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    window.history.back();
  });

  function showLoading(){
    playerContainer.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Preparing player...</div>
      </div>
    `;
  }

  function showError(msg){
    playerContainer.innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠</div>
        <div class="error-title">Playback Error</div>
        <div class="error-message">${msg}</div>
        <button class="retry-btn" onclick="location.reload()">Try Again</button>
      </div>
    `;
  }

  function initPlayer(){
    if(!type || !id){
      showError('Invalid player parameters. Please try again.');
      return;
    }

    try{
      if(type === 'youtube'){
        // YouTube Trailer
        modeBadge.textContent = 'Trailer';
        const iframeSrc = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&controls=1&modestbranding=1`;
        playerContainer.innerHTML = `<div class="iframe-wrapper"><iframe src="${iframeSrc}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      else if(type === 'movie'){
        // Movie from VidSrc
        modeBadge.textContent = 'Movie';
        // VidSrc embed format: https://vsembed.ru/embed/tmdb/movie/{movieId}
        const iframeSrc = `https://vsembed.ru/embed/tmdb/movie/${encodeURIComponent(id)}`;
        playerContainer.innerHTML = `<div class="iframe-wrapper"><iframe src="${iframeSrc}" allow="fullscreen" allowfullscreen></iframe></div>`;
      }
      else{
        showError('Unknown player type. Please try again.');
      }
    }catch(err){
      showError('Failed to initialize player. Please check your connection and try again.');
      console.error('Player error:', err);
    }
  }

  // Initialize player after short delay to show loading state
  setTimeout(initPlayer, 300);
</script>
</body>
</html>
