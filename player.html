<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GHAZI OTT — Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0b0f;
            --bg-2: #101015;
            --bg-card: #16161c;
            --bg-elevated: #23232c;
            --red: #E50914;
            --red-dark: #B20710;
            --red-glow: rgba(229,9,20,0.45);
            --gold: #f5c518;
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --text-dim: #7c7c85;
            --green: #46d369;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Player Container ── */
        .player-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* ── Header ── */
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(0,0,0,0.3));
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(60,60,68,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--red);
            border-color: var(--red);
            transform: translateX(-3px);
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: white;
            max-width: 350px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-badge {
            background: var(--red);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-btn {
            background: rgba(60,60,68,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            background: rgba(100,100,110,0.9);
            border-color: white;
        }

        /* ── Player Area ── */
        .player-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Loading State ── */
        .loading-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: var(--text-muted);
            z-index: 50;
        }

        .loading-state.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* ── Error State ── */
        .error-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            z-index: 50;
            text-align: center;
            padding: 40px 20px;
        }

        .error-state.hidden {
            display: none;
        }

        .error-icon {
            font-size: 3rem;
            color: var(--red);
        }

        .error-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
        }

        .error-message {
            font-size: 0.95rem;
            max-width: 400px;
            line-height: 1.5;
        }

        .retry-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s ease;
            font-size: 0.95rem;
        }

        .retry-btn:hover {
            background: var(--red-dark);
        }

        /* ── Footer ── */
        .player-footer {
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
        }

        /* ── Keyboard Help ── */
        .keyboard-help {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(16,16,21,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 0.8rem;
            max-width: 240px;
            z-index: 80;
            display: none;
            backdrop-filter: blur(10px);
            color: var(--text-muted);
            line-height: 1.6;
        }

        .keyboard-help.show {
            display: block;
        }

        .keyboard-help-close {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .player-header {
                padding: 12px 16px;
            }

            .header-title {
                font-size: 0.9rem;
                max-width: 200px;
            }

            .header-meta {
                font-size: 0.65rem;
            }

            .back-btn,
            .settings-btn {
                width: 36px;
                height: 36px;
                font-size: 0.95rem;
            }

            .keyboard-help {
                font-size: 0.7rem;
                padding: 12px 14px;
                max-width: 180px;
                bottom: 10px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            .header-info {
                display: none;
            }

            .player-badge {
                font-size: 0.6rem;
                padding: 3px 8px;
            }

            .keyboard-help {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <!-- Header -->
        <div class="player-header">
            <div class="header-left">
                <button class="back-btn" id="backBtn" title="Back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-info">
                    <div class="header-title" id="headerTitle">Loading...</div>
                    <div class="header-meta" id="headerMeta"></div>
                </div>
            </div>
            <div class="header-right">
                <span class="player-badge" id="playerBadge">MOVIE</span>
                <button class="settings-btn" id="helpBtn" title="Keyboard Shortcuts">
                    <i class="fas fa-question"></i>
                </button>
            </div>
        </div>

        <!-- Player Area -->
        <div class="player-area">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div class="loading-text">Preparing player...</div>
            </div>
            <div class="error-state hidden" id="errorState">
                <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="error-title">Playback Error</div>
                <div class="error-message" id="errorMessage">Unable to load video. Please try again or check your connection.</div>
                <button class="retry-btn" id="retryBtn">Retry</button>
            </div>
            <iframe class="player-iframe" id="playerIframe" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
        </div>

        <!-- Footer -->
        <div class="player-footer">
            Powered by <strong>GHAZI OTT</strong> • Streaming with <strong>VidSrc</strong> • Enjoy unlimited entertainment
        </div>
    </div>

    <!-- Keyboard Help -->
    <div class="keyboard-help" id="keyboardHelp">
        <button class="keyboard-help-close" id="helpClose">&times;</button>
        <div style="font-weight: 700; margin-bottom: 8px; color: white;">Keyboard Controls</div>
        <div><kbd>Space</kbd> Play / Pause</div>
        <div><kbd>→</kbd> Skip 10s</div>
        <div><kbd>←</kbd> Back 10s</div>
        <div><kbd>M</kbd> Mute / Unmute</div>
        <div><kbd>F</kbd> Fullscreen</div>
        <div><kbd>?</kbd> Help</div>
        <div><kbd>Esc</kbd> Exit</div>
    </div>

    <script>
        // ═══════ Configuration ═══════
        const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
        const VIDSRC_BASE = 'https://vsembed.ru/embed/tmdb';

        // ═══════ Get URL Parameters ═══════
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const mediaType = params.get('type') || 'movie'; // 'movie' or 'tv'
        const season = params.get('season');
        const episode = params.get('episode');

        const headerTitle = document.getElementById('headerTitle');
        const headerMeta = document.getElementById('headerMeta');
        const playerBadge = document.getElementById('playerBadge');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const playerIframe = document.getElementById('playerIframe');
        const retryBtn = document.getElementById('retryBtn');
        const backBtn = document.getElementById('backBtn');
        const helpBtn = document.getElementById('helpBtn');
        const helpClose = document.getElementById('helpClose');
        const keyboardHelp = document.getElementById('keyboardHelp');

        // ═══════ Helper Functions ═══════
        function showError(msg) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            document.getElementById('errorMessage').textContent = msg;
        }

        function showLoading() {
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            playerIframe.style.display = 'none';
        }

        function showPlayer() {
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            playerIframe.style.display = 'block';
        }

        function buildVidSrcUrl() {
            if (!movieId) return null;

            if (mediaType === 'movie') {
                // Movie URL format: https://vsembed.ru/embed/tmdb/movie/{id}
                return `${VIDSRC_BASE}/movie/${movieId}`;
            } else if (mediaType === 'tv') {
                // TV URL format: https://vsembed.ru/embed/tmdb/tv/{id}/{season}/{episode}
                const s = season || 1;
                const e = episode || 1;
                return `${VIDSRC_BASE}/tv/${movieId}/${s}/${e}`;
            }
            return null;
        }

        // ═══════ Initialize Player ═══════
        function initPlayer() {
            if (!movieId) {
                showError('Invalid video ID. Please check the link and try again.');
                return;
            }

            try {
                const vidSrcUrl = buildVidSrcUrl();
                if (!vidSrcUrl) {
                    showError('Invalid media type. Please try again.');
                    return;
                }

                // Set title and metadata
                const title = localStorage.getItem(`movie_${movieId}`) || 'Video';
                headerTitle.textContent = title;
                
                const typeLabel = mediaType === 'movie' ? 'MOVIE' : 'TV SERIES';
                playerBadge.textContent = typeLabel;
                if (season && episode) {
                    playerBadge.textContent = `S${season}:E${episode}`;
                    headerMeta.textContent = `Season ${season} • Episode ${episode}`;
                }

                // Load iframe
                setTimeout(() => {
                    playerIframe.src = vidSrcUrl;
                    playerIframe.onload = () => {
                        showPlayer();
                    };
                    // Fallback if iframe doesn't trigger onload
                    setTimeout(() => {
                        if (playerIframe.style.display !== 'block') {
                            showPlayer();
                        }
                    }, 3000);
                }, 500);

            } catch (error) {
                console.error('Player init error:', error);
                showError('Failed to initialize player. Please try again.');
            }
        }

        // ═══════ Event Listeners ═══════
        backBtn.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        helpBtn.addEventListener('click', () => {
            keyboardHelp.classList.toggle('show');
        });

        helpClose.addEventListener('click', () => {
            keyboardHelp.classList.remove('show');
        });

        retryBtn.addEventListener('click', () => {
            playerIframe.src = '';
            showLoading();
            initPlayer();
        });

        // ═══════ Keyboard Shortcuts ═══════
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                keyboardHelp.classList.remove('show');
                backBtn.click();
            }
            if (e.key === '?') {
                e.preventDefault();
                keyboardHelp.classList.toggle('show');
            }
        });

        // ═══════ Start ═══════
        showLoading();
        initPlayer();
    </script>
</body>
</html>
